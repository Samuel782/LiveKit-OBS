<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
<!-- PALETTE: lascia vuoto per usare quella comune (palette.js), oppure scegli un tema
     (blu-verde, viola-rosa, tramonto, cyberpunk, foresta, oro, fuoco, oceano, ghiaccio, monocromo)
     o colori esadecimali validi solo per questo file. -->
<script>window.PALETTE_FILE = { tema: "", c1: "", c2: "", c3: "", sfondo: "" };</script>
<script src="../palette.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: var(--sfondo);
            width: 100vw;
            height: 100vh;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            mix-blend-mode: screen;
            animation: cyber 10s infinite alternate ease-in-out;
        }
        #b1 { 
            width: 75vw; height: 75vw; 
            background: radial-gradient(circle, rgba(var(--c1-rgb), 0.6) 0%, rgba(var(--c1-rgb), 0) 70%);
            top: -10%; left: -10%; 
        }
        #b2 { 
            width: 70vw; height: 70vw; 
            background: radial-gradient(circle, rgba(var(--c2-rgb), 0.45) 0%, rgba(var(--c2-rgb), 0) 70%);
            bottom: -20%; right: -10%; 
            animation-duration: 14s;
        }
        #b3 { 
            width: 60vw; height: 60vw; 
            background: radial-gradient(circle, rgba(var(--c3-rgb), 0.5) 0%, rgba(var(--c3-rgb), 0) 70%);
            top: 30%; left: 40%; 
            animation-duration: 8s; 
        }
        @keyframes cyber {
            0% { transform: translate(-5%, -5%) scale(0.95); }
            100% { transform: translate(15%, 15%) scale(1.15); }
        }
    </style>
</head>
<body>
    <div class="blob" id="b1"></div>
    <div class="blob" id="b2"></div>
    <div class="blob" id="b3"></div>
</body>
</html>
