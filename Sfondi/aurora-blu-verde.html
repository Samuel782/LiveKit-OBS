<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
<!-- PALETTE: lascia vuoto per usare quella comune (palette.js), oppure scegli un tema
     (blu-verde, viola-rosa, tramonto, cyberpunk, foresta, oro, fuoco, oceano, ghiaccio, monocromo)
     o colori esadecimali validi solo per questo file. -->
<script>window.PALETTE_FILE = { tema: "", c1: "", c2: "", c3: "", sfondo: "" };</script>
<script src="../palette.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: var(--sfondo); /* Sfondo blu notte molto scuro */
            width: 100vw;
            height: 100vh;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            mix-blend-mode: screen;
            animation: float 14s infinite alternate ease-in-out;
        }
        /* Blu intenso */
        #b1 { 
            width: 80vw; 
            height: 80vw; 
            background: radial-gradient(circle, rgba(var(--c1-rgb), 0.55) 0%, rgba(var(--c1-rgb), 0) 70%);
            top: -20%; 
            left: -15%; 
        }
        /* Verde smeraldo */
        #b2 { 
            width: 85vw; 
            height: 85vw; 
            background: radial-gradient(circle, rgba(var(--c2-rgb), 0.45) 0%, rgba(var(--c2-rgb), 0) 70%);
            bottom: -25%; 
            right: -15%; 
            animation-duration: 18s;
            animation-direction: alternate-reverse;
        }
        /* Ciano/Verde acqua per amalgamare */
        #b3 { 
            width: 70vw; 
            height: 70vw; 
            background: radial-gradient(circle, rgba(var(--c3-rgb), 0.4) 0%, rgba(var(--c3-rgb), 0) 70%);
            top: 20%; 
            left: 25%; 
            animation-duration: 11s; 
        }

        @keyframes float {
            0% { transform: translate(-10%, -10%) scale(0.95); }
            50% { transform: translate(15%, 10%) scale(1.1); }
            100% { transform: translate(-5%, 20%) scale(1); }
        }
    </style>
</head>
<body>
    <div class="blob" id="b1"></div>
    <div class="blob" id="b2"></div>
    <div class="blob" id="b3"></div>
</body>
</html>
