<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Campo stellare</title>
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden;
    background: radial-gradient(ellipse at 50% 50%, #0a1a33 0%, #02050c 75%); }
  canvas { display: block; width: 100vw; height: 100vh; }
  .nebulosa { position: fixed; inset: 0; pointer-events: none; mix-blend-mode: screen;
    background:
      radial-gradient(ellipse 40% 30% at 25% 35%, rgba(29,78,216,.30), transparent 70%),
      radial-gradient(ellipse 35% 30% at 75% 65%, rgba(16,185,129,.22), transparent 70%);
    animation: respira 20s ease-in-out infinite alternate; }
  @keyframes respira { to { transform: scale(1.15) rotate(3deg); opacity: .7; } }
</style>
</head>
<body>
<div class="nebulosa"></div>
<canvas id="c"></canvas>
<script>
  /* ====== PERSONALIZZA QUI (o via URL: ?stelle=700&velocita=1.5) ====== */
  const Q = new URLSearchParams(location.search);
  const STELLE = +(Q.get("stelle") || 700);
  const VELOCITA = +(Q.get("velocita") || 1.2);   // 0 = stelle ferme che brillano
  /* ==================================================================== */

  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  let W, H;
  const size = () => { W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio; };
  size(); addEventListener("resize", size);

  const TINTE = ["#ffffff", "#bfdbfe", "#a7f3d0", "#93c5fd"];
  const nuova = (z) => ({ x: (Math.random() - .5) * 2, y: (Math.random() - .5) * 2, z: z ?? Math.random(),
    c: TINTE[(Math.random() * TINTE.length) | 0], tw: Math.random() * 6.28 });
  const stelle = Array.from({ length: STELLE }, () => nuova());

  let prec = 0;
  function frame(t) {
    const dt = Math.min(50, t - prec) / 1000; prec = t;
    ctx.fillStyle = "rgba(2,5,12,0.35)";           // leggera scia
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "source-over";
    const cx = W / 2, cy = H / 2, f = Math.max(W, H) * .5;
    for (const s of stelle) {
      s.z -= dt * 0.08 * VELOCITA;
      if (s.z <= 0.02) Object.assign(s, nuova(1));
      const k = 1 / s.z, x = cx + s.x * f * k * .5, y = cy + s.y * f * k * .5;
      if (x < 0 || x > W || y < 0 || y > H) { Object.assign(s, nuova(1)); continue; }
      const r = Math.max(.4, (1 - s.z) * 2.4) * devicePixelRatio;
      ctx.globalAlpha = Math.min(1, (1 - s.z) * 1.4) * (.7 + .3 * Math.sin(t / 400 + s.tw));
      ctx.fillStyle = s.c;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
