<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
<!-- PALETTE: lascia vuoto per usare quella comune (palette.js), oppure scegli un tema
     (blu-verde, viola-rosa, tramonto, cyberpunk, foresta, oro, fuoco, oceano, ghiaccio, monocromo)
     o colori esadecimali validi solo per questo file. -->
<script>window.PALETTE_FILE = { tema: "", c1: "", c2: "", c3: "", sfondo: "" };</script>
<script src="../palette.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: var(--sfondo);
            width: 100vw;
            height: 100vh;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            mix-blend-mode: screen;
            animation: aurora 16s infinite alternate ease-in-out;
        }
        #b1 { 
            width: 90vw; height: 90vw; 
            background: radial-gradient(circle, rgba(var(--c3-scuro-rgb), 0.5) 0%, rgba(var(--c3-scuro-rgb), 0) 70%);
            top: -30%; left: -20%; 
        }
        #b2 { 
            width: 80vw; height: 80vw; 
            background: radial-gradient(circle, rgba(var(--c2-scuro-rgb), 0.45) 0%, rgba(var(--c2-scuro-rgb), 0) 70%);
            bottom: -30%; right: -20%; 
            animation-duration: 22s;
        }
        #b3 { 
            width: 65vw; height: 65vw; 
            background: radial-gradient(circle, rgba(var(--c2-chiaro-rgb), 0.35) 0%, rgba(var(--c2-chiaro-rgb), 0) 70%);
            top: 10%; left: 30%; 
            animation-duration: 12s; 
        }
        @keyframes aurora {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(15%, -10%) scale(1.15); }
            100% { transform: translate(-10%, 15%) scale(0.9); }
        }
    </style>
</head>
<body>
    <div class="blob" id="b1"></div>
    <div class="blob" id="b2"></div>
    <div class="blob" id="b3"></div>
</body>
</html>
