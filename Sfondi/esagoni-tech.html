<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<!-- PALETTE: lascia vuoto per usare quella comune (palette.js), oppure scegli un tema
     (blu-verde, viola-rosa, tramonto, cyberpunk, foresta, oro, fuoco, oceano, ghiaccio, monocromo)
     o colori esadecimali validi solo per questo file. -->
<script>window.PALETTE_FILE = { tema: "", c1: "", c2: "", c3: "", sfondo: "" };</script>
<script src="../palette.js"></script>
<title>Esagoni tech</title>
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: var(--sfondo); }
  canvas { display: block; width: 100vw; height: 100vh; }
  .vignetta { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(var(--sfondo-rgb),.9) 100%); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignetta"></div>
<script>
  /* ====== PERSONALIZZA QUI (o via URL: ?lato=46) ====== */
  const Q = new URLSearchParams(location.search);
  const LATO = +(Q.get("lato") || 46);              // dimensione esagono
  const C1 = PAL["c1-chiaro"].slice(1), C2 = PAL.c2.slice(1);   // dalla palette
  /* ======================================================================= */
  const rgb = (h) => [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16));
  const A = rgb(C1), B = rgb(C2);

  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  let W, H, celle = [];
  function size() {
    const dpr = devicePixelRatio;
    W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr;
    const r = LATO * dpr, w = Math.sqrt(3) * r, h = 1.5 * r;
    celle = [];
    for (let row = -1; row * h < H + r; row++)
      for (let col = -1; col * w < W + w; col++)
        celle.push({ x: col * w + (row % 2 ? w / 2 : 0), y: row * h, r, f: Math.random() * 6.28 });
  }
  size(); addEventListener("resize", size);

  function esagono(x, y, r) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 3 * i + Math.PI / 6;
      ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    }
    ctx.closePath();
  }

  function frame(t) {
    t /= 1000;
    ctx.clearRect(0, 0, W, H);
    // un'onda di luce che attraversa la griglia in diagonale
    const onda = (t * 0.12) % 1.6 - 0.3;
    for (const c of celle) {
      const u = (c.x / W + c.y / H) / 2;
      const vicino = Math.max(0, 1 - Math.abs(u - onda) * 6);
      const pulsa = (Math.sin(t * 1.3 + c.f) + 1) / 2 * 0.3;
      const k = Math.min(1, pulsa + vicino * .85);
      const col = A.map((v, i) => Math.round(v + (B[i] - v) * u));
      esagono(c.x, c.y, c.r * 0.92);
      ctx.fillStyle = `rgba(${col},${0.03 + k * 0.3})`;
      ctx.fill();
      ctx.strokeStyle = `rgba(${col},${0.22 + k * 0.7})`;
      ctx.lineWidth = devicePixelRatio * 1.2;
      ctx.stroke();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
