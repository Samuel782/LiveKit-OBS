<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
<!-- PALETTE: lascia vuoto per usare quella comune (palette.js), oppure scegli un tema
     (blu-verde, viola-rosa, tramonto, cyberpunk, foresta, oro, fuoco, oceano, ghiaccio, monocromo)
     o colori esadecimali validi solo per questo file. -->
<script>window.PALETTE_FILE = { tema: "", c1: "", c2: "", c3: "", sfondo: "" };</script>
<script src="../palette.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: var(--sfondo); /* Sfondo blu scurissimo quasi nero */
            width: 100vw;
            height: 100vh;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            mix-blend-mode: screen;
            animation: edgeFloat 15s infinite alternate ease-in-out;
        }
        /* Blu intenso sul lato sinistro */
        #b1 { 
            width: 75vw; height: 75vw; 
            background: radial-gradient(circle, rgba(var(--c1-rgb), 0.55) 0%, rgba(var(--c1-rgb), 0) 65%);
            top: -25%; left: -25%; 
        }
        /* Verde smeraldo sul lato destro */
        #b2 { 
            width: 75vw; height: 75vw; 
            background: radial-gradient(circle, rgba(var(--c2-rgb), 0.45) 0%, rgba(var(--c2-rgb), 0) 65%);
            bottom: -25%; right: -25%; 
            animation-duration: 19s;
            animation-direction: alternate-reverse;
        }
        /* Tocco di ciano in alto/basso ai margini */
        #b3 { 
            width: 65vw; height: 65vw; 
            background: radial-gradient(circle, rgba(var(--c3-rgb), 0.35) 0%, rgba(var(--c3-rgb), 0) 65%);
            bottom: -30%; left: 10%; 
            animation-duration: 13s; 
        }

        /* Zona centrale statica e scura per garantire la massima leggibilità dei sottotitoli */
        #safe-zone {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, rgba(var(--sfondo-rgb), 0.92) 25%, rgba(var(--sfondo-rgb), 0.4) 65%, rgba(var(--sfondo-rgb), 0) 100%);
            pointer-events: none;
            z-index: 10;
        }

        @keyframes edgeFloat {
            0% { transform: translate(-5%, -5%) scale(0.95); }
            50% { transform: translate(8%, 5%) scale(1.05); }
            100% { transform: translate(-3%, 8%) scale(1); }
        }
    </style>
</head>
<body>
    <div class="blob" id="b1"></div>
    <div class="blob" id="b2"></div>
    <div class="blob" id="b3"></div>
    <div id="safe-zone"></div>
</body>
</html>
