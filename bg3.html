<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #020617;
            width: 100vw;
            height: 100vh;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            mix-blend-mode: screen;
            animation: cyber 10s infinite alternate ease-in-out;
        }
        #b1 { 
            width: 75vw; height: 75vw; 
            background: radial-gradient(circle, rgba(37, 99, 235, 0.6) 0%, rgba(37, 99, 235, 0) 70%);
            top: -10%; left: -10%; 
        }
        #b2 { 
            width: 70vw; height: 70vw; 
            background: radial-gradient(circle, rgba(34, 197, 94, 0.45) 0%, rgba(34, 197, 94, 0) 70%);
            bottom: -20%; right: -10%; 
            animation-duration: 14s;
        }
        #b3 { 
            width: 60vw; height: 60vw; 
            background: radial-gradient(circle, rgba(14, 165, 233, 0.5) 0%, rgba(14, 165, 233, 0) 70%);
            top: 30%; left: 40%; 
            animation-duration: 8s; 
        }
        @keyframes cyber {
            0% { transform: translate(-5%, -5%) scale(0.95); }
            100% { transform: translate(15%, 15%) scale(1.15); }
        }
    </style>
</head>
<body>
    <div class="blob" id="b1"></div>
    <div class="blob" id="b2"></div>
    <div class="blob" id="b3"></div>
</body>
</html>
