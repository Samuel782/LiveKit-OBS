<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Orologio analogico</title>
<!--
  Orologio analogico con lancette fluide, sfondo trasparente. Consigliato: Fonte Browser 400x400.
  Parametri URL: fuso=Europe/Rome (o America/New_York, Asia/Tokyo...)   citta=Roma (etichetta)
-->
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { display: grid; place-items: center; height: 100vh;
    font-family: "SF Pro Display", "Helvetica Neue", "Segoe UI", Arial, sans-serif; }
  svg { width: 92vmin; height: 92vmin; filter: drop-shadow(0 6px 20px rgba(0,0,0,.45)); }
  .citta { font-size: 6px; letter-spacing: .3em; fill: rgba(255,255,255,.6); text-anchor: middle; font-weight: 600; }
</style>
</head>
<body>
<svg viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bordo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#10b981"/></linearGradient>
    <radialGradient id="quadrante"><stop offset="0" stop-color="#0b1a33"/><stop offset="1" stop-color="#040914"/></radialGradient>
  </defs>
  <circle cx="50" cy="50" r="47" fill="url(#quadrante)" stroke="url(#bordo)" stroke-width="2.5"/>
  <g id="tacche"></g>
  <text class="citta" id="citta" x="50" y="68"></text>
  <line id="h" x1="50" y1="54" x2="50" y2="28" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <line id="m" x1="50" y1="56" x2="50" y2="15" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <line id="s" x1="50" y1="60" x2="50" y2="12" stroke="#10b981" stroke-width=".9" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="2.4" fill="#10b981"/><circle cx="50" cy="50" r="1" fill="#040914"/>
</svg>
<script>
  const Q = new URLSearchParams(location.search), FUSO = Q.get("fuso");
  document.getElementById("citta").textContent = (Q.get("citta") || "").toUpperCase();
  const g = document.getElementById("tacche");
  for (let i = 0; i < 60; i++) {
    const ora = i % 5 === 0, a = i * 6 * Math.PI / 180, r1 = ora ? 38 : 41, r2 = 43;
    const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
    l.setAttribute("x1", 50 + Math.sin(a) * r1); l.setAttribute("y1", 50 - Math.cos(a) * r1);
    l.setAttribute("x2", 50 + Math.sin(a) * r2); l.setAttribute("y2", 50 - Math.cos(a) * r2);
    l.setAttribute("stroke", ora ? "#fff" : "rgba(255,255,255,.35)"); l.setAttribute("stroke-width", ora ? 1.6 : .6);
    l.setAttribute("stroke-linecap", "round"); g.appendChild(l);
  }
  const ruota = (id, deg) => document.getElementById(id).setAttribute("transform", `rotate(${deg} 50 50)`);
  function adesso() {
    const d = new Date();
    if (!FUSO) return [d.getHours(), d.getMinutes(), d.getSeconds() + d.getMilliseconds() / 1000];
    const p = new Intl.DateTimeFormat("en-GB", { timeZone: FUSO, hour: "numeric", minute: "numeric", second: "numeric", hourCycle: "h23" })
      .formatToParts(d).reduce((o, x) => (o[x.type] = +x.value, o), {});
    return [p.hour, p.minute, p.second + d.getMilliseconds() / 1000];
  }
  (function tick() {
    const [h, m, s] = adesso();
    ruota("s", s * 6); ruota("m", (m + s / 60) * 6); ruota("h", ((h % 12) + m / 60) * 30);
    requestAnimationFrame(tick);
  })();
</script>
</body>
</html>
