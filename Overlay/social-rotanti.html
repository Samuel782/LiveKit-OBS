<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Social rotanti</title>
<!--
  Mostra i tuoi social uno alla volta, a rotazione. Consigliato: Fonte Browser 700x140.
  Parametri URL:
    social=YouTube:@canale,Instagram:@profilo,TikTok:@profilo,Twitch:canale
    secondi=5        durata di ciascuno
-->
<style>
  html, body { margin: 0; background: transparent; overflow: hidden;
    font-family: "SF Pro Display", "Helvetica Neue", "Segoe UI", Arial, sans-serif; }
  body { display: flex; align-items: center; height: 100vh; padding-left: 16px; }
  .pill { display: flex; align-items: center; gap: 18px; padding: 14px 30px 14px 14px; border-radius: 999px;
    background: rgba(4,9,20,.85); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 8px 30px rgba(0,0,0,.35);
    overflow: hidden; }
  .icona { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; color: #fff;
    font-weight: 800; font-size: 28px; flex: none; transition: background .5s; }
  .icona svg { width: 36px; height: 36px; fill: #fff; }
  .testi { position: relative; height: 64px; min-width: 260px; }
  .riga { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; justify-content: center; height: 100%; white-space: nowrap; }
  .riga b { font-size: 16px; letter-spacing: .25em; text-transform: uppercase; color: rgba(255,255,255,.6); font-weight: 600; }
  .riga span { font-size: 30px; color: #fff; font-weight: 700; }
  .entra { animation: entra .6s cubic-bezier(.2,.8,.2,1) both; }
  .esce { animation: esce .45s ease-in both; }
  @keyframes entra { from { transform: translateY(100%); opacity: 0; } }
  @keyframes esce { to { transform: translateY(-100%); opacity: 0; } }
</style>
</head>
<body>
  <div class="pill"><div class="icona" id="icona"></div><div class="testi" id="testi"></div></div>
<script>
  /* ====== PERSONALIZZA QUI (o via URL) ====== */
  const Q = new URLSearchParams(location.search);
  const SOCIAL = (Q.get("social") || "YouTube:@iltuocanale,Instagram:@iltuoprofilo,TikTok:@iltuoprofilo,Twitch:iltuocanale")
    .split(",").map(s => s.split(":"));
  const SECONDI = +(Q.get("secondi") || 5);
  /* ========================================== */
  const STILI = {
    youtube:   ["#ff0000", '<svg viewBox="0 0 24 24"><path d="M9.5 7.5v9l7.5-4.5z"/></svg>'],
    instagram: ["linear-gradient(45deg,#f09433,#dc2743,#bc1888)", '<svg viewBox="0 0 24 24"><path d="M7 3h10a4 4 0 014 4v10a4 4 0 01-4 4H7a4 4 0 01-4-4V7a4 4 0 014-4zm0 2a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2zm5 3.5A3.5 3.5 0 1112 15.5 3.5 3.5 0 0112 8.5zm0 2a1.5 1.5 0 100 3 1.5 1.5 0 000-3zM17.3 5.8a1 1 0 110 2 1 1 0 010-2z"/></svg>'],
    tiktok:    ["#111", '<svg viewBox="0 0 24 24"><path d="M14 3h3a4 4 0 004 4v3a7 7 0 01-4-1.3V15a6 6 0 11-6-6v3a3 3 0 103 3z"/></svg>'],
    twitch:    ["#9146ff", '<svg viewBox="0 0 24 24"><path d="M5 3l-2 4v12h4v3h3l3-3h4l5-5V3zm15 10l-3 3h-4l-3 3v-3H7V5h13zM16 8h2v5h-2zm-5 0h2v5h-2z"/></svg>'],
    x:         ["#000", '<svg viewBox="0 0 24 24"><path d="M4 4h4.5l4 5.6L17 4h3l-6.2 7.2L21 20h-4.5l-4.4-6L7 20H4l6.8-7.8z"/></svg>'],
    facebook:  ["#1877f2", '<svg viewBox="0 0 24 24"><path d="M14 8V6.5c0-.8.4-1.2 1.3-1.2H17V2h-2.6C11.6 2 10.7 3.7 10.7 6.2V8H8v3.3h2.7V22H14V11.3h2.7L17 8z"/></svg>'],
    discord:   ["#5865f2", '<svg viewBox="0 0 24 24"><path d="M19 5.5A16 16 0 0015 4l-.5 1a14 14 0 00-5 0L9 4a16 16 0 00-4 1.5C2.5 9.3 1.8 13 2.1 16.6A16 16 0 007 19l1-1.6c-.9-.3-1.7-.7-2.4-1.2l.6-.4a11 11 0 009.6 0l.6.4c-.7.5-1.5.9-2.4 1.2l1 1.6a16 16 0 004.9-2.4c.4-4.2-.7-7.9-2.9-11.1zM9 14.4c-.9 0-1.7-.9-1.7-2s.8-2 1.7-2 1.7.9 1.7 2-.8 2-1.7 2zm6 0c-.9 0-1.7-.9-1.7-2s.8-2 1.7-2 1.7.9 1.7 2-.8 2-1.7 2z"/></svg>'],
  };
  const icona = document.getElementById("icona"), testi = document.getElementById("testi");
  let i = 0, attuale = null;
  function mostra() {
    const [nome, handle] = SOCIAL[i % SOCIAL.length];
    const [colore, svg] = STILI[nome.toLowerCase()] || ["linear-gradient(135deg,#1d4ed8,#10b981)", nome[0]];
    icona.style.background = colore; icona.innerHTML = svg;
    if (attuale) { const v = attuale; v.className = "riga esce"; setTimeout(() => v.remove(), 450); }
    const r = document.createElement("div"); r.className = "riga entra";
    r.innerHTML = "<b></b><span></span>"; r.querySelector("b").textContent = nome; r.querySelector("span").textContent = handle || "";
    testi.appendChild(r); attuale = r; i++;
  }
  mostra();
  if (SOCIAL.length > 1) setInterval(mostra, SECONDI * 1000);
</script>
</body>
</html>
