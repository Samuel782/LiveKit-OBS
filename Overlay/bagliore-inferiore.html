<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
<!-- PALETTE: lascia vuoto per usare quella comune (palette.js), oppure scegli un tema
     (blu-verde, viola-rosa, tramonto, cyberpunk, foresta, oro, fuoco, oceano, ghiaccio, monocromo)
     o colori esadecimali validi solo per questo file. -->
<script>window.PALETTE_FILE = { tema: "", c1: "", c2: "", c3: "", sfondo: "" };</script>
<script src="../palette.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: transparent; /* Trasparente, così si fonde con OBS */
            width: 100vw;
            height: 100vh;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.7;
            animation: barMove 12s infinite alternate ease-in-out;
        }
        #b1 { 
            width: 600px; height: 250px; 
            background: var(--c1-scuro); 
            bottom: 20px; left: 10%; 
        }
        #b2 { 
            width: 700px; height: 250px; 
            background: var(--c2-scuro); 
            bottom: 20px; right: 10%; 
            animation-duration: 16s;
        }
        @keyframes barMove {
            0% { transform: translateY(0) scaleX(1); }
            100% { transform: translateY(-30px) scaleX(1.2); }
        }
    </style>
</head>
<body>
    <div class="blob" id="b1"></div>
    <div class="blob" id="b2"></div>
</body>
</html>
