<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #06111c; /* Sfondo blu notte molto scuro */
            width: 100vw;
            height: 100vh;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            mix-blend-mode: screen;
            animation: float 14s infinite alternate ease-in-out;
        }
        /* Blu intenso */
        #b1 { 
            width: 80vw; 
            height: 80vw; 
            background: radial-gradient(circle, rgba(29, 78, 216, 0.55) 0%, rgba(29, 78, 216, 0) 70%);
            top: -20%; 
            left: -15%; 
        }
        /* Verde smeraldo */
        #b2 { 
            width: 85vw; 
            height: 85vw; 
            background: radial-gradient(circle, rgba(16, 185, 129, 0.45) 0%, rgba(16, 185, 129, 0) 70%);
            bottom: -25%; 
            right: -15%; 
            animation-duration: 18s;
            animation-direction: alternate-reverse;
        }
        /* Ciano/Verde acqua per amalgamare */
        #b3 { 
            width: 70vw; 
            height: 70vw; 
            background: radial-gradient(circle, rgba(6, 182, 212, 0.4) 0%, rgba(6, 182, 212, 0) 70%);
            top: 20%; 
            left: 25%; 
            animation-duration: 11s; 
        }

        @keyframes float {
            0% { transform: translate(-10%, -10%) scale(0.95); }
            50% { transform: translate(15%, 10%) scale(1.1); }
            100% { transform: translate(-5%, 20%) scale(1); }
        }
    </style>
</head>
<body>
    <div class="blob" id="b1"></div>
    <div class="blob" id="b2"></div>
    <div class="blob" id="b3"></div>
</body>
</html>
